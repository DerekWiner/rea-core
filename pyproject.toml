[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rea-core"
version = "0.1.0"
description = "Shared evidence contracts and validation tools for the REA ecosystem"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Derek Winer" }]
dependencies = ["jsonschema>=4.22,<5"]
keywords = ["research", "provenance", "evidence", "reverse-engineering", "json-schema"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
rea-core = "rea_core.cli:main"

[tool.setuptools.package-data]
rea_core = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
